<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B2B">
<meta name="application-name" content="B2B">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>B2B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header (título + semana do mesociclo) → abas de seção → conteúdo em coluna única de até 860px; cores das anilhas olímpicas marcam o tipo de treino */
:root{
  --bg:#f2f3f1; --surface:#ffffff; --surface-2:#e8eae7; --line:#d5d8d4;
  --fg:#16191d; --muted:#5d636b; --accent:#16191d; --on-accent:#f2f3f1;
  --push:#c8312b; --pull:#2457a6; --legs:#c99a06; --arms:#2f8a4a;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1b1f24; --surface-2:#252a31; --line:#323840;
  --fg:#ebe8e2; --muted:#9aa1aa; --accent:#ebe8e2; --on-accent:#121417;
  --push:#e5544c; --pull:#5b8ee0; --legs:#e2b62c; --arms:#4fb26b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1f24; --surface-2:#252a31; --line:#323840;
  --fg:#ebe8e2; --muted:#9aa1aa; --accent:#ebe8e2; --on-accent:#121417;
  --push:#e5544c; --pull:#5b8ee0; --legs:#e2b62c; --arms:#4fb26b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:28px;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:26px;font-weight:700;text-transform:uppercase}
h3{font-size:19px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.label{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.weeks{display:flex;gap:4px;flex-wrap:wrap}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-family:var(--font-display);font-weight:600;font-size:15px}
.weeks button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.weekinfo{font-size:13px;margin-top:6px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;padding:9px 12px;font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}

main{padding-top:20px;display:grid;gap:20px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.days a{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 4px 7px;text-align:center;border-top:4px solid var(--c)}
.days a b{display:block;font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1}
.days a span{font-size:11px;color:var(--muted)}
.days a[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg);border-top-color:var(--c)}
.days a[aria-current="page"] span{color:var(--bg);opacity:.75}

.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-left:6px solid var(--c);padding-left:12px}
.dayhead .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.dayhead .meta b{font-family:var(--font-mono);font-weight:500}
.reset{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.ex.done{opacity:.6}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exhead h3 small{font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--legs);margin-left:6px;vertical-align:2px}
.num{font-family:var(--font-display);font-weight:600;color:var(--muted);font-size:15px;flex:none}
.rx{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.rx div{display:flex;flex-direction:column}
.rx .v{font-family:var(--font-mono);font-size:16px;font-variant-numeric:tabular-nums}
.restbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 10px;font-family:var(--font-mono);font-size:14px}
.setgrid{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 42px;gap:8px;align-items:center}
.setrow.head span{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setrow .n{font-family:var(--font-mono);color:var(--muted);text-align:center;font-size:13px}
.setrow input{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-family:var(--font-mono);font-size:16px;font-variant-numeric:tabular-nums}
.setrow input::placeholder{color:var(--muted);opacity:.7}
.setrow .ok{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:17px;line-height:1}
.setrow.on .ok{background:var(--c);border-color:var(--c);color:#fff}
.setrow.on input{border-color:var(--c)}
.last{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;border:1.5px solid var(--fg);color:var(--fg);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.evo-top{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.evo-top select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{stroke:var(--fg);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--fg);opacity:.07}
.chart .dot{fill:var(--surface);stroke:var(--fg);stroke-width:2}
.chart .end{fill:var(--fg)}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.chart text.endlbl{fill:var(--fg);font-size:12px;font-weight:500}
.empty{padding:20px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}
.bk textarea{width:100%;min-height:90px;font-family:var(--font-mono);font-size:12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.bk .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:6px;padding:7px 12px;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg)}
.sets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sets button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;font-family:var(--font-mono);font-size:13px}
.sets button.on{background:var(--c);border-color:var(--c);color:#fff}
.tech{font-size:13.5px;padding:8px 10px;border-radius:6px;background:var(--surface-2)}
.tech b{font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.note{font-size:13.5px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.prose{display:grid;gap:10px;max-width:68ch}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted)}
td.mono{white-space:nowrap}
tr.cur td{background:var(--surface-2)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--fg);border-radius:6px}
.bar .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.bar .v{font-family:var(--font-mono);text-align:right}

.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--fg)}

.cardio{background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:14px;display:grid;gap:6px}
.cardio.none{border-style:solid;border-color:var(--line)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--fg);color:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.timer .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
.timer .t{font-family:var(--font-mono);font-size:26px;font-variant-numeric:tabular-nums}
.timer .prog{flex:1;height:6px;background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:3px;overflow:hidden}
.timer .prog i{display:block;height:100%;background:var(--bg)}
.timer button{border:1px solid var(--bg);background:transparent;color:var(--bg);border-radius:6px;padding:5px 10px;font-size:13px}
.timer.over .t{color:var(--legs)}

@media (max-width:560px){
  h1{font-size:24px}
  .days{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .days a span{display:none}
  .bar{grid-template-columns:96px 1fr 30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="label">Back to Best · Ficha D1–D5</div>
        <h1>B2B</h1>
      </div>
      <div>
        <div class="label" style="margin-bottom:4px">Semana do mesociclo</div>
        <div class="weeks" id="weeks"></div>
      </div>
    </div>
    <p class="weekinfo muted" id="weekinfo"></p>
    <nav class="tabs" id="tabs">
      <a href="#d1" data-v="treinos">Treinos</a>
      <a href="#evolucao" data-v="evolucao">Evolução</a>
      <a href="#plano" data-v="plano">Plano</a>
      <a href="#progressao" data-v="progressao">Progressão</a>
      <a href="#cardio" data-v="cardio">Cardio</a>
      <a href="#tecnicas" data-v="tecnicas">Técnicas</a>
      <a href="#metricas" data-v="metricas">Métricas</a>
    </nav>
  </header>
  <main id="app"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="in">
    <span class="t" id="tt">0:00</span>
    <div class="prog"><i id="tp" style="width:0"></i></div>
    <button id="tplus" type="button">+30 s</button>
    <button id="tstop" type="button">Parar</button>
  </div>
</div>

<script>
const PLATE={push:'var(--push)',pull:'var(--pull)',legs:'var(--legs)',arms:'var(--arms)'};
const WEEKS=[
  {n:1,label:'Calibração',comp:'3',iso:'2',tech:false,extra:0,txt:'Achar as cargas de trabalho depois de 6 meses sem progressão. Sem técnicas, longe da falha.'},
  {n:2,label:'Base',comp:'2',iso:'1',tech:false,extra:0,txt:'Primeiras subidas de carga. Ainda sem técnicas de intensidade.'},
  {n:3,label:'Acúmulo',comp:'1–2',iso:'0–1',tech:true,extra:1,txt:'Entram as técnicas na última série e +1 série nos exercícios ★. HIIT liberado.'},
  {n:4,label:'Acúmulo',comp:'1–2',iso:'0–1',tech:true,extra:1,txt:'Mesmo volume da S3, buscando mais carga ou reps.'},
  {n:5,label:'Pico',comp:'0–1',iso:'0 (falha)',tech:true,extra:1,txt:'Semana mais dura do ciclo: isoladores até a falha técnica.'},
  {n:6,label:'Deload',comp:'4',iso:'3–4',tech:false,deload:true,txt:'Metade das séries, mesma carga, sem técnicas. Cardio só zona 2.'}
];
// t: c = composto, i = isolador. p = prioridade (+1 série nas S3–S5). m = músculos diretos.
const DAYS=[
 {id:'d1',name:'Peito e tríceps',short:'Peito/Tri',k:'push',ex:[
  {n:'Supino reto com barra',s:4,r:'1 × 4–6 + 3 × 6–8',t:'c',rest:150,m:['Peito'],note:'1 top set pesado, depois 3 back-offs com 10% a menos.'},
  {n:'Supino inclinado com halteres',s:3,r:'8–10',t:'c',rest:120,m:['Peito'],p:1},
  {n:'Chest press na máquina',s:2,r:'8–12',t:'c',rest:90,m:['Peito'],tech:'Rest-pause'},
  {n:'Crucifixo no cabo, de baixo para cima',s:3,r:'12–15',t:'i',rest:60,m:['Peito'],note:'Abra bem os braços: a parte alongada é a que mais conta.'},
  {n:'Tríceps testa com barra W',s:3,r:'8–12',t:'i',rest:75,m:['Tríceps'],tech:'Rest-pause'},
  {n:'Tríceps francês no cabo',s:3,r:'10–12',t:'i',rest:60,m:['Tríceps']},
  {n:'Tríceps na polia com corda',s:2,r:'12–15',t:'i',rest:60,m:['Tríceps'],tech:'Myo-reps'}]},
 {id:'d2',name:'Quadríceps',short:'Quad',k:'legs',ex:[
  {n:'Agachamento livre',s:4,r:'1 × 4–6 + 3 × 6–8',t:'c',rest:150,m:['Quadríceps'],note:'Top set e back-offs com 10% a menos.'},
  {n:'Hack squat',s:3,r:'8–12',t:'c',rest:120,m:['Quadríceps'],tech:'Parciais alongadas'},
  {n:'Leg press 45°',s:2,r:'10–15',t:'c',rest:120,m:['Quadríceps']},
  {n:'Agachamento búlgaro',s:2,r:'8–10 por perna',t:'c',rest:90,m:['Quadríceps','Glúteos']},
  {n:'Cadeira extensora',s:3,r:'12–15',t:'i',rest:60,m:['Quadríceps'],p:1,tech:'Drop set'},
  {n:'Panturrilha em pé',s:4,r:'8–12',t:'i',rest:60,m:['Panturrilha'],note:'Pausa de 2 s embaixo, no alongamento.'},
  {n:'Abdominal na polia',s:3,r:'10–15',t:'i',rest:60,m:['Abdômen']}]},
 {id:'d3',name:'Costas e bíceps',short:'Costas/Bi',k:'pull',ex:[
  {n:'Barra fixa com carga',s:3,r:'1 × 4–6 + 2 × 6–8',t:'c',rest:150,m:['Costas'],note:'Top set com carga no cinto, back-offs com menos carga.'},
  {n:'Remada Pendlay',s:3,r:'6–8',t:'c',rest:120,m:['Costas']},
  {n:'Puxada com pegada neutra',s:3,r:'8–12',t:'c',rest:90,m:['Costas']},
  {n:'Remada unilateral com halter',s:3,r:'8–12',t:'c',rest:75,m:['Costas'],p:1,note:'Deixe a escápula descer toda no fim de cada rep.'},
  {n:'Pullover no cabo',s:2,r:'12–15',t:'i',rest:60,m:['Costas'],tech:'Parciais alongadas'},
  {n:'Rosca direta com barra',s:3,r:'6–10',t:'i',rest:75,m:['Bíceps'],tech:'Drop set'},
  {n:'Rosca inclinada com halteres',s:3,r:'8–12',t:'i',rest:60,m:['Bíceps']}]},
 {id:'d4',name:'Ombros',short:'Ombros',k:'arms',ex:[
  {n:'Desenvolvimento militar em pé',s:3,r:'1 × 4–6 + 2 × 6–8',t:'c',rest:150,m:['Ombro anterior'],note:'Top set e back-offs com 10% a menos.'},
  {n:'Desenvolvimento na máquina',s:2,r:'8–12',t:'c',rest:90,m:['Ombro anterior']},
  {n:'Elevação lateral com halteres',s:4,r:'12–20',t:'i',rest:60,m:['Ombro lateral'],p:1,tech:'Drop set duplo'},
  {n:'Elevação lateral no cabo, atrás do corpo',s:3,r:'12–15',t:'i',rest:60,m:['Ombro lateral'],tech:'Myo-reps'},
  {n:'Crucifixo invertido na máquina',s:3,r:'15–20',t:'i',rest:60,m:['Ombro posterior'],tech:'Myo-reps'},
  {n:'Face pull',s:3,r:'15–20',t:'i',rest:60,m:['Ombro posterior']},
  {n:'Elevação de pernas pendurado',s:3,r:'10–15',t:'i',rest:60,m:['Abdômen']}]},
 {id:'d5',name:'Posteriores de coxa e glúteos',short:'Posterior',k:'legs',ex:[
  {n:'Levantamento terra romeno',s:4,r:'6–8',t:'c',rest:150,m:['Posterior de coxa','Glúteos']},
  {n:'Cadeira flexora sentada',s:4,r:'10–12',t:'i',rest:75,m:['Posterior de coxa'],p:1,tech:'Drop set'},
  {n:'Mesa flexora',s:3,r:'10–12',t:'i',rest:75,m:['Posterior de coxa']},
  {n:'Hip thrust',s:3,r:'8–12',t:'c',rest:90,m:['Glúteos']},
  {n:'Hiperextensão 45°',s:2,r:'12–15',t:'i',rest:60,m:['Glúteos','Posterior de coxa']},
  {n:'Panturrilha sentado',s:4,r:'12–20',t:'i',rest:60,m:['Panturrilha']}]}
];
const CARDIO_DAY=[
 {t:'Zona 2 · 25–30 min',d:'Esteira a 5–6 km/h, 8–12% de inclinação, sem segurar no corrimão. Ritmo em que dá para falar frases inteiras (≈110–130 bpm).'},
 null,
 {t:'HIIT · 15–20 min',d:'5 min de aquecimento, 6–8 × (1 min forte / 2 min leve), 3 min de volta à calma. Forte = esforço 8–9 de 10. De preferência na bike.',s3:'Nas S1–S2, faça 20 min de zona 2 no lugar.'},
 {t:'Zona 2 · 40 min',d:'Esteira a 5–6 km/h, 8–12% de inclinação, sem segurar no corrimão. Ritmo em que dá para falar frases inteiras (≈110–130 bpm).'},
 {t:'Zona 2 · 25–30 min',d:'Esteira a 5–6 km/h, 8–12% de inclinação, sem segurar no corrimão. Ritmo em que dá para falar frases inteiras (≈110–130 bpm).'}
];
const CARDIO=['Zona 2, 25–30 min','—','HIIT 15–20 min (a partir da S3)','Zona 2, 40 min','Zona 2, 25–30 min'];
const TECH={
 'Top set + back-off':'Uma série pesada no topo (RIR 1), depois séries com 10% a menos e mais reps. Combina estímulo de força com volume.',
 'Rest-pause':'Chegue a RIR 0–1, descanse 15–20 s, faça mais reps, repita 2 vezes. Só na última série.',
 'Myo-reps':'Série de ativação até RIR 0–1, depois mini-séries de 3–5 reps com 3–5 respirações de pausa, até perder a rep alvo.',
 'Drop set':'No fim da série, reduza 20–30% da carga e continue até RIR 0. Só na última série.',
 'Drop set duplo':'Dois drops seguidos de 20–30% cada, sem descanso.',
 'Parciais alongadas':'Ao chegar perto da falha na amplitude total, faça 4–6 reps parciais na metade mais alongada do movimento.'
};

const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function setsFor(e,w){const W=WEEKS[w-1];if(W.deload)return Math.ceil(e.s/2);return e.s+(e.p&&W.extra?1:0)}
function rirFor(e,w){const W=WEEKS[w-1];return e.t==='c'?W.comp:W.iso}
function fmtRest(s){const m=Math.floor(s/60),r=s%60;return m+':'+String(r).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ---- Registro de cargas ----
const LOG_KEY='b2b-log';
function getLog(){return LS.get(LOG_KEY,{})}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){const [y,m,d]=s.split('-');return d+'/'+m}
function hasData(x){return x.sets.some(s=>s.kg||s.r)}
function entriesOf(name){return (getLog()[name]||[]).slice().sort((a,b)=>a.d<b.d?-1:1)}
function lastEntry(name){const t=today();const a=entriesOf(name).filter(x=>x.d<t&&hasData(x));return a[a.length-1]}
function todayEntry(name){return entriesOf(name).find(x=>x.d===today())}
function saveSet(name,k,patch){
  const L=getLog();const arr=L[name]||(L[name]=[]);
  let e=arr.find(x=>x.d===today());
  if(!e){e={d:today(),w:week,sets:[]};arr.push(e)}
  while(e.sets.length<=k)e.sets.push({});
  Object.assign(e.sets[k],patch);e.w=week;
  LS.set(LOG_KEY,L);
}
function clearToday(names){const L=getLog();const t=today();names.forEach(n=>{if(L[n])L[n]=L[n].filter(x=>x.d!==t)});LS.set(LOG_KEY,L)}
function e1rm(kg,r){return kg*(1+r/30)}
function bestOf(x){let b=0;x.sets.forEach(s=>{const kg=+s.kg,r=+s.r;if(kg>0&&r>0)b=Math.max(b,e1rm(kg,r))});return b}
function topKg(x){return Math.max(0,...x.sets.map(s=>+s.kg||0))}
function topRep(e){const m=e.r.match(/(\d+)\D*$/);return m?+m[1]:0}
function fmtKg(n){return (Math.round(n*10)/10).toLocaleString('pt-BR')}
function setsTxt(x){return x.sets.filter(s=>s.kg||s.r).map(s=>(s.kg?fmtKg(+s.kg):'–')+'×'+(s.r||'–')).join('  ')}
function suggestion(e,k,last){
  if(!last)return '';
  const work=(e.r.includes('+')?last.sets.slice(1):last.sets).filter(s=>s.kg&&s.r);
  const top=topRep(e);
  if(work.length<2||!top)return '';
  if(!work.every(s=>+s.r>=top))return '';
  const inc=e.t==='c'?(k==='legs'?'+5 kg':'+2–2,5 kg'):'o menor salto de carga';
  return `<span class="badge">Suba a carga: ${inc}</span>`;
}

  app.querySelectorAll('.setgrid').forEach(g=>{

      const y=window.scrollY;renderDay(id);window.scrollTo(0,y)});

  app.querySelectorAll('.restbtn').forEach(b=>b.onclick=()=>startTimer(+b.dataset.rest));

function renderEvo(){
  const all=[];DAYS.forEach((d,di)=>d.ex.forEach(e=>all.push({e,d,di})));
  const withData=all.filter(x=>entriesOf(x.e.n).some(hasData));
  let sel=LS.get('b2b-evo',null);
  if(!all.some(x=>x.e.n===sel))sel=(withData[0]||all[0]).e.n;
  const it=all.find(x=>x.e.n===sel);
  const ses=entriesOf(sel).filter(x=>bestOf(x)>0);
  const opts=DAYS.map((d,di)=>`<optgroup label="D${di+1} · ${esc(d.name)}">${d.ex.map(e=>{const n=entriesOf(e.n).filter(hasData).length;return `<option value="${esc(e.n)}" ${e.n===sel?'selected':''}>${esc(e.n)}${n?` (${n})`:''}</option>`}).join('')}</optgroup>`).join('');
  let body='';
  if(!ses.length){
    body=`<div class="empty">Nenhuma sessão registrada para este exercício ainda.<br>Anote carga e reps na tela do treino e a evolução aparece aqui.</div>`;
  }else{
    const ys=ses.map(bestOf),first=ys[0],lastV=ys[ys.length-1],best=Math.max(...ys),bestI=ys.indexOf(best);
    const diff=lastV-first,pct=first?diff/first*100:0;
    body=`<div class="stats">
      <div><span class="label">1RM estimado atual</span><b>${fmtKg(lastV)} kg</b></div>
      <div><span class="label">Melhor marca</span><b>${fmtKg(best)} kg</b><span class="note">${fmtDate(ses[bestI].d)}</span></div>
      <div><span class="label">Desde o início</span><b>${diff>=0?'+':''}${fmtKg(diff)} kg</b><span class="note">${diff>=0?'+':''}${fmtKg(pct)}% em ${ses.length} ${ses.length>1?'sessões':'sessão'}</span></div>
    </div>
    ${chartSVG(ses.map(x=>x.d),ys)}
    <p class="note">1RM estimado pela fórmula de Epley, a partir da melhor série de cada sessão. Serve para comparar sessões entre si, não como teste de carga máxima.</p>
    <div class="tablewrap"><table><thead><tr><th>Data</th><th>Semana</th><th>Séries (kg × reps)</th><th>1RM est.</th></tr></thead><tbody>
      ${ses.slice().reverse().map(x=>`<tr><td class="mono">${fmtDate(x.d)}</td><td class="mono">S${x.w||'–'}</td><td class="mono">${esc(setsTxt(x))}</td><td class="mono">${fmtKg(bestOf(x))}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  app.innerHTML=`
  <section class="prose"><h2>Evolução</h2><p>Escolha um exercício para ver como a força vem evoluindo sessão a sessão.</p></section>
  <section class="card" style="--c:${PLATE[it.d.k]}">
    <div class="evo-top"><div style="display:grid;gap:4px;min-width:0;flex:1"><label class="label" for="evo-ex">Exercício</label><select id="evo-ex">${opts}</select></div></div>
    ${body}
  </section>`;
  document.getElementById('evo-ex').onchange=ev=>{LS.set('b2b-evo',ev.target.value);renderEvo()};
}

function chartSVG(dates,ys){
  const W=640,H=230,L=46,R=64,T=16,B=30,iw=W-L-R,ih=H-T-B;
  let lo=Math.min(...ys),hi=Math.max(...ys);
  if(hi-lo<5){const m=(hi+lo)/2;lo=m-2.5;hi=m+2.5}
  const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const step=[1,2,2.5,5,10,20,25,50].find(s=>(hi-lo)/s<=5)||100;
  const t0=Math.ceil(lo/step)*step;const ticks=[];for(let v=t0;v<=hi;v+=step)ticks.push(v);
  const x=i=>L+(ys.length===1?iw/2:i/(ys.length-1)*iw);const y=v=>T+(1-(v-lo)/(hi-lo))*ih;
  const pts=ys.map((v,i)=>[x(i),y(v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=ys.length>1?path+` L${pts[pts.length-1][0].toFixed(1)} ${T+ih} L${pts[0][0].toFixed(1)} ${T+ih} Z`:'';
  const lp=pts[pts.length-1];
  return `<div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do 1RM estimado">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${L+iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtKg(v)}</text>`).join('')}
    ${area?`<path class="area" d="${area}"/>`:''}
    ${ys.length>1?`<path class="line" d="${path}"/>`:''}
    ${pts.slice(0,-1).map(p=>`<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join('')}
    <circle class="end" cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="5"/>
    <text class="endlbl" x="${(lp[0]+9).toFixed(1)}" y="${(lp[1]+4).toFixed(1)}">${fmtKg(ys[ys.length-1])} kg</text>
    <text x="${x(0).toFixed(1)}" y="${H-8}" text-anchor="${ys.length===1?'middle':'start'}">${fmtDate(dates[0])}</text>
    ${ys.length>1?`<text x="${x(ys.length-1).toFixed(1)}" y="${H-8}" text-anchor="end">${fmtDate(dates[dates.length-1])}</text>`:''}
  </svg></div>`;
}

function volume(){

}

    <li>Falha total não supera parar perto dela. <a href="https://scholars.duke.edu/publication/1687483" target="_blank" rel="noopener">Refalo et al. 2023</a></li>
    <li>Mais perto da falha, mais hipertrofia, dentro de 0–5 RIR. <a href="https://www.fau.edu/newsdesk/articles/muscle-growth-strength-study" target="_blank" rel="noopener">Robinson et al. 2024</a></li>
    <li>Descanso acima de 60 s tem pequena vantagem; acima de 90 s, sem diferença clara. <a href="https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2024.1429789/text" target="_blank" rel="noopener">Singer et al. 2024</a></li>
    <li>Cardio junto com musculação não compromete hipertrofia nem força máxima. <a href="https://pubmed.ncbi.nlm.nih.gov/34757594/" target="_blank" rel="noopener">Schumann et al. 2022</a></li>
    <li>Corrida tem leve efeito negativo nas fibras tipo I; bike não. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9474354/" target="_blank" rel="noopener">Lundberg et al. 2022</a></li></ul></section>`;
}

function renderMet(){
  const key='fr-checks';const ck=LS.get(key,{});
  const items=['Fazer bioimpedância ou DEXA de linha de base','Medir cintura na altura do umbigo e tirar fotos (frente, lado, costas)','Registrar as cargas da primeira passada pelos 5 treinos','Medir a média de passos sem mudar a rotina'];
  app.innerHTML=`
  <section class="prose"><h2>Métricas</h2><p>Cargas subindo com a cintura caindo é o sinal de recomposição, mesmo com a balança parada.</p></section>
  <section class="card"><h3>Primeira semana</h3><ul class="checks">${items.map((t,i)=>`<li><label><input type="checkbox" id="ck${i}" ${ck[i]?'checked':''}> <span>${t}</span></label></li>`).join('')}</ul></section>
  <section class="card"><div class="tablewrap"><table>
    <thead><tr><th>Métrica</th><th>Como medir</th><th>Frequência</th></tr></thead><tbody>
    <tr><td>Peso</td><td>Em jejum, após o banheiro; olhar a média de 7 dias</td><td>Diário</td></tr>
    <tr><td>Cintura</td><td>Fita no umbigo, ao fim de uma expiração tranquila</td><td>Semanal</td></tr>
    <tr><td>Cargas</td><td>Cada série na tela do treino; acompanhe na aba Evolução</td><td>Toda sessão</td></tr>
    <tr><td>Passos</td><td>Média diária da semana</td><td>Semanal</td></tr>
    <tr><td>Fotos</td><td>Mesma luz, horário e poses</td><td>A cada 4 semanas</td></tr>
    <tr><td>Composição</td><td>Bioimpedância nas mesmas condições, ou DEXA</td><td>A cada 8–12 semanas</td></tr>
    </tbody></table></div></section>
  <section class="card bk"><h3>Backup dos registros</h3>
    <p class="note">Os registros ficam só neste aparelho e navegador. Copie o backup de vez em quando e guarde numa nota; para levar a outro aparelho, cole lá e toque em Restaurar.</p>
    <div class="row"><button class="btn" type="button" id="bk-copy">Copiar backup</button></div>
    <textarea id="bk-text" placeholder="Cole aqui um backup para restaurar" aria-label="Texto do backup"></textarea>
    <div class="row"><button class="btn ghost" type="button" id="bk-restore">Restaurar backup</button></div>
    <p class="note" id="bk-msg" aria-live="polite"></p>
  </section>`;
  app.querySelectorAll('.checks input').forEach((el,i)=>el.onchange=()=>{ck[i]=el.checked;LS.set(key,ck)});
  const msg=document.getElementById('bk-msg'),ta=document.getElementById('bk-text');
  document.getElementById('bk-copy').onclick=()=>{const txt=JSON.stringify(getLog());ta.value=txt;
    const ok=()=>{msg.textContent='Backup copiado. Cole numa nota para guardar.'};
    const fb=()=>{ta.focus();ta.select();msg.textContent='Não deu para copiar sozinho: o texto está selecionado acima, copie manualmente.'};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}};
  let armed=false;const rb=document.getElementById('bk-restore');
  rb.onclick=()=>{let data;try{data=JSON.parse(ta.value);if(!data||typeof data!=='object'||Array.isArray(data))throw 0}catch(e){msg.textContent='Esse texto não é um backup válido do B2B. Copie de novo o backup completo.';return}
    if(!armed){armed=true;rb.textContent='Toque de novo para substituir os registros atuais';setTimeout(()=>{armed=false;rb.textContent='Restaurar backup'},5000);return}
    LS.set(LOG_KEY,data);armed=false;rb.textContent='Restaurar backup';msg.textContent='Backup restaurado.'};
}

function route(){
  const h=(location.hash||'#d1').slice(1);
  const view=DAYS.some(d=>d.id===h)?'treinos':(['evolucao','plano','progressao','cardio','tecnicas','metricas'].includes(h)?h:'treinos');
  document.querySelectorAll('#tabs a').forEach(a=>{a.toggleAttribute('aria-current',false);if(a.dataset.v===view)a.setAttribute('aria-current','page')});
  if(view==='treinos'){let id=DAYS.some(d=>d.id===h)?h:LS.get('fr-day','d1');if(!DAYS.some(d=>d.id===id))id='d1';LS.set('fr-day',id);document.querySelector('#tabs a[data-v="treinos"]').href='#'+id;renderDay(id)}
  else ({evolucao:renderEvo,plano:renderPlano,progressao:renderProg,cardio:renderCardio,tecnicas:renderTec,metricas:renderMet})[view]();
}

// Timer de descanso
let tEnd=0,tTot=0,tInt=null;
const timer=document.getElementById('timer'),tt=document.getElementById('tt'),tp=document.getElementById('tp');
function startTimer(s){tTot=s;tEnd=Date.now()+s*1000;timer.hidden=false;clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const left=Math.round((tEnd-Date.now())/1000);const over=left<0;
  timer.classList.toggle('over',over);tt.textContent=(over?'+':'')+fmtRest(Math.abs(left));
  tp.style.width=Math.max(0,Math.min(1,1-left/tTot))*100+'%'}
document.getElementById('tplus').onclick=()=>{tEnd+=30000;tTot+=30;tick()};
document.getElementById('tstop').onclick=()=>{clearInterval(tInt);timer.hidden=true};

window.addEventListener('hashchange',route);
renderWeeks();route();
</script>
